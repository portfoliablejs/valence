name: Release Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.actor == 'schimanko'
    runs-on: ubuntu-latest
    environment:
      name: Packages
      url: https://www.npmjs.com/package/@portfoliablejs/valence
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Import GPG key for verified commits and tags
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          if [ -z "${RELEASE_GPG_PRIVATE_KEY:-}" ]; then
            echo "RELEASE_GPG_PRIVATE_KEY not set; proceeding without signed release commit/tag"
            echo "RELEASE_SIGN=false" >> $GITHUB_ENV
            exit 0
          fi
          if printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | base64 --decode > /tmp/release-private-key.asc 2>/dev/null; then
            true
          else
            printf '%s' "$RELEASE_GPG_PRIVATE_KEY" > /tmp/release-private-key.asc
          fi
          gpg --batch --import /tmp/release-private-key.asc
          KEY_ID="$RELEASE_GPG_KEY_ID"
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{print $2}' | awk -F/ '{print $2}' | head -n 1)
          fi
          if [ -z "$KEY_ID" ]; then
            echo "Could not determine signing key id"
            exit 1
          fi
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true
          git config tag.gpgsign true
          echo "RELEASE_SIGN=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Configure git
        run: |
          git config user.name "schimanko"
          git config user.email "schimanko@users.noreply.github.com"

      - name: Compute release plan and apply versions
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SUBJECT="$(git log -1 --pretty=%s)"
          if [[ "$HEAD_SUBJECT" == chore\(release\):* ]]; then
            VERSION="$(node -p "require('./package.json').version")"
            echo "release_commit=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "released_any=true" >> "$GITHUB_OUTPUT"
            echo "released_valence=true" >> "$GITHUB_OUTPUT"
            echo "valence_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "valence_tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "Release commit detected for version $VERSION."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> $GITHUB_OUTPUT
            echo "release_commit=false" >> "$GITHUB_OUTPUT"
            node ./scripts/release-orchestrator.mjs --dry-run
          else
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "release_commit=false" >> "$GITHUB_OUTPUT"
            node ./scripts/release-orchestrator.mjs
          fi

      - name: Open release pull request
        if: steps.release-plan.outputs.released_any == 'true' && steps.release-plan.outputs.release_commit != 'true' && steps.release-plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release-plan.outputs.valence_version }}"
          BRANCH="release/v${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): @portfoliablejs/valence@${VERSION}" \
            --body "Automated release pull request for @portfoliablejs/valence ${VERSION}."

      - name: Create and push release tag
        if: steps.release-plan.outputs.release_commit == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          TAG="${{ steps.release-plan.outputs.valence_tag }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Upgrade npm for OIDC Trusted Publishing
        if: steps.release-plan.outputs.release_commit == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          npm install -g npm@latest
          hash -r

      - name: Diagnostics for npm trusted publishing
        if: steps.release-plan.outputs.released_valence == 'true' && steps.release-plan.outputs.release_commit == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "package=$PACKAGE_NAME"
          echo "registry=$(npm config get registry)"
          npm ping || true
          REGISTRY="$(npm config get registry)"
          if [ "$REGISTRY" != "https://registry.npmjs.org/" ] && [ "$REGISTRY" != "https://registry.npmjs.org" ]; then
            echo "Unexpected npm registry: $REGISTRY"
            exit 1
          fi

      - name: Publish @portfoliablejs/valence to npm
        if: steps.release-plan.outputs.released_valence == 'true' && steps.release-plan.outputs.release_commit == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: npm publish --provenance --access public

      - name: Setup GitHub Packages publishing
        if: steps.release-plan.outputs.released_valence == 'true' && steps.release-plan.outputs.release_commit == 'true' && steps.release-plan.outputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@portfoliablejs'

      - name: Publish @portfoliablejs/valence to GitHub Packages
        if: steps.release-plan.outputs.released_valence == 'true' && steps.release-plan.outputs.release_commit == 'true' && steps.release-plan.outputs.dry_run != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release for @portfoliablejs/valence
        if: steps.release-plan.outputs.released_valence == 'true' && steps.release-plan.outputs.release_commit == 'true' && steps.release-plan.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release-plan.outputs.valence_tag }}"
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"generate_release_notes\":true}"

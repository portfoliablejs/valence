name: Release Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release @portfoliablejs/valence
        id: valence-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there are commits since the last release
          latest_tag=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            # No previous tags, compare to first commit
            latest_tag=$(git rev-list --max-parents=0 HEAD)
          fi
          commits_since_last=$(git log ${latest_tag}..HEAD --oneline 2>/dev/null | wc -l)
          
          if [ "$commits_since_last" -gt 0 ]; then
            before=$(node -p "require('./package.json').version")
            npx semantic-release
            after=$(node -p "require('./package.json').version")
            if [ "$before" != "$after" ]; then
              echo "released=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No commits since last release, skipping"
          fi

      - name: Publish @portfoliablejs/valence to GitHub Packages
        if: steps.valence-release.outputs.released == 'true'
        run: |
          echo "@portfoliablejs:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
